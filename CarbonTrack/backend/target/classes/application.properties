spring.application.name=carbontrack-backend
server.port=8080

# H2 local database

spring.datasource.url=jdbc:h2:file:./data/carbontrack;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT

carbontrack.jwt.secret=${JWT_SECRET:carbontrack_super_secure_jwt_secret_key_2026_min_256_bits_for_sha256}
carbontrack.jwt.expiration-ms=86400000

# CORS

carbontrack.cors.allowed-origins=[http://localhost:3000,http://localhost:5173](http://localhost:3000,http://localhost:5173)

# Swagger

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging

logging.level.com.carbontrack=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
